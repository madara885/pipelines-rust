name: Rust CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: actions/rust-lang/setup-rust-toolchain@v1
      - name: Build and Test
        run: |
          if [ -f Cargo.toml ]; then
            cargo build --verbose
            cargo test --verbose
          else
            echo "No Cargo.toml found, skipping."
          fi